# Runs the whole app locally: docker compose up --build
# Then open http://localhost:5173 (ports can be changed in .env)
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: smart_canteen
      POSTGRES_USER: canteen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-canteen_dev_only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - smart_canteen_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U canteen -d smart_canteen"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: dev
      PORT: 8080
      DATABASE_URL: jdbc:postgresql://postgres:5432/smart_canteen
      DB_USERNAME: canteen
      DB_PASSWORD: ${POSTGRES_PASSWORD:-canteen_dev_only}
      JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret-not-for-any-real-deployment}
      PICKUP_SECRET: ${PICKUP_SECRET:-dev-only-pickup-secret-not-for-any-real-deployment}
      PAYMENT_GATEWAY: ${PAYMENT_GATEWAY:-sandbox}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      # Raise only for repeated automated test runs; they log in as the same staff account.
      LOGIN_LIMIT_PER_EMAIL: ${LOGIN_LIMIT_PER_EMAIL:-10}
      SLOT_CAPACITY: ${SLOT_CAPACITY:-10}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:${FRONTEND_PORT:-5173}}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8081}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_DEMO_MODE: ${VITE_DEMO_MODE:-true}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  smart_canteen_pg_data:
