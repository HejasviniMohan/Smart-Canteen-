server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Client-side routes: refreshing /menu must still load the app.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Live updates must reach the browser immediately, not sit in nginx's buffer.
    # ^~ matters: without it, the regex location below would win and buffer the stream.
    location ^~ /api/events/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location ~ ^/(api|swagger-ui|v3)(/|$) {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
