# ====== Server ======
server.port=${PORT:8080}
spring.application.name=smart-canteen-backend
server.forward-headers-strategy=native

# 'dev' for local development (Postgres from docker compose), 'prod' for deployment.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ====== Jackson ======
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# ====== JPA / Flyway ======
# Flyway owns the schema; Hibernate only checks that the entities match it.
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
# Loads lazy collections in batches, which removes N+1 queries on order lists.
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.flyway.enabled=true

# ====== Logging ======
logging.level.org.springframework.security=INFO
logging.level.com.canteen=INFO

# ====== Secrets: no defaults on purpose. The app will not start without them. ======
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:43200000}
app.pickup.secret=${PICKUP_SECRET}

# ====== Payments: razorpay | sandbox (sandbox refuses to start under the prod profile) ======
app.payment.gateway=${PAYMENT_GATEWAY:razorpay}
app.payment.expiry-minutes=${PAYMENT_EXPIRY_MINUTES:15}

# ====== Canteen ======
app.timezone=${APP_TIMEZONE:Asia/Kolkata}
app.canteen.open=${CANTEEN_OPEN:08:00}
app.canteen.close=${CANTEEN_CLOSE:20:00}
app.canteen.slot-minutes=${SLOT_MINUTES:15}
app.canteen.slot-capacity=${SLOT_CAPACITY:10}
app.canteen.min-lead-minutes=${SLOT_MIN_LEAD_MINUTES:10}
app.canteen.minutes-per-order=${MINUTES_PER_ORDER:2}

# ====== Demo data (accounts with published passwords): opt-in only ======
app.seed.demo=${SEED_DEMO_DATA:false}

# ====== First admin, created at startup only when no admin exists ======
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# ====== Login rate limits (attempts per minute) ======
app.security.login-limit-per-email=${LOGIN_LIMIT_PER_EMAIL:10}
app.security.login-limit-per-ip=${LOGIN_LIMIT_PER_IP:60}

# ====== CORS ======
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ====== Swagger / health ======
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha
management.endpoints.web.exposure.include=health
