# ====== Server ======
server.port=${PORT:8080}
spring.application.name=smart-canteen-backend

# ====== Profiles ======
# 'dev' = H2 in-memory (PostgreSQL compatibility mode) - for local development
# 'prod' = PostgreSQL - for deployment
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ====== Jackson ======
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Asia/Kolkata
spring.jackson.default-property-inclusion=non_null

# ====== JPA ======
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ====== Logging ======
logging.level.org.springframework.security=INFO
logging.level.com.canteen=DEBUG
logging.level.org.hibernate.SQL=INFO

# ====== JWT ======
app.jwt.secret=${JWT_SECRET:canteen-super-secret-key-change-me-in-production-min-256-bits-required}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ====== Razorpay ======
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_placeholder}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:razorpay_test_secret_placeholder}

# ====== CORS ======
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# ====== Swagger ======
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha

# ====== File upload limit ======
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB