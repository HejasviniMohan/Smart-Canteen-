# ====== Prod profile: PostgreSQL ======
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/smart_canteen}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:Canteen@2026}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

spring.sql.init.mode=never
spring.h2.console.enabled=false

# Disable dev seeder in prod (use real DB seed from db/schema.sql)
spring.autoconfigure.exclude=