# Local development only. These values are public; never reuse them anywhere else.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5433}/smart_canteen}
spring.datasource.username=${DB_USERNAME:canteen}
spring.datasource.password=${DB_PASSWORD:canteen_dev_only}

app.jwt.secret=${JWT_SECRET:dev-only-jwt-secret-not-for-any-real-deployment}
app.pickup.secret=${PICKUP_SECRET:dev-only-pickup-secret-not-for-any-real-deployment}

app.payment.gateway=${PAYMENT_GATEWAY:sandbox}
app.payment.sandbox-secret=dev-only-sandbox-secret

# Always open locally, so the demo works at any hour.
app.canteen.open=${CANTEEN_OPEN:00:00}
app.canteen.close=${CANTEEN_CLOSE:23:59}

app.seed.demo=${SEED_DEMO_DATA:true}
logging.level.com.canteen=DEBUG

# Optional: try real Razorpay test mode locally with PAYMENT_GATEWAY=razorpay
app.razorpay.key-id=${RAZORPAY_KEY_ID:}
app.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
app.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}
