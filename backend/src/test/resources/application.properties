spring.profiles.active=test
spring.datasource.url=jdbc:h2:mem:smart_canteen_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=never
spring.sql.init.platform=h2
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

app.jwt.secret=test-secret-key-must-be-at-least-32-bytes-long-abc
app.jwt.expiration-ms=3600000
app.cors.allowed-origins=http://localhost:5173

razorpay.key.id=rzp_test_placeholder
razorpay.key.secret=razorpay_test_secret_placeholder

logging.level.org.springframework=INFO
logging.level.com.canteen=INFO